<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>camera tile</title>
  <link rel="stylesheet" href="style2.css">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
</head>
<body>
  <header>
    <video id="preview" autoplay playsinline muted></video>
    <div class="status"><div class="dot" id="dot"></div><span id="gaze">loading model…</span></div>
    <span id="peers">connecting…</span>
    <span id="count">0 frames</span>
    <button id="saveBtn" disabled>Save sheet</button>
    <button id="clearBtn">Clear</button>
    <button id="resetBtn">Reset camera</button>
  </header>

  <div id="grid"></div>
  <p id="empty">Waiting for camera… allow access when your browser asks.</p>

  <canvas id="cap" hidden></canvas>

  <script type="module" src="script2.js"></script>
</body>
</html>
